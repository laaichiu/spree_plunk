<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your seller account with {{store_name | escape ?? Shop}} is suspended</title>
</head>
<body style="margin:0; padding:32px 12px; background:#f6f5f2; color:#111111; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%; max-width:640px; background:#ffffff; border:1px solid #e7e5df;"><tr><td style="padding:32px 36px;">
      <p style="margin:0; font-size:12px; letter-spacing:.16em; text-transform:uppercase;">{{store_name | escape ?? Shop}}</p>
      <h1 style="margin:24px 0 12px; font-size:30px; font-weight:400;">Your seller account is suspended</h1>
      <p style="margin:0; font-size:15px; line-height:24px; color:#4b4843;">The seller account for {{seller.name | escape}} has been suspended. Please contact the store team if you have questions about this change.</p>
      {% if store_email != blank %}<p style="margin-top:28px; font-size:13px; line-height:21px; color:#6f6b64;">Contact {{store_email | escape}} for assistance.</p>{% endif %}
    </td></tr></table>
  </td></tr></table>
</body>
</html>
